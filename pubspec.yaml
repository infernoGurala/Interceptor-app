name: interceptor
description: "A personal doom-scrolling replacement app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Backend
  supabase_flutter: ^2.9.0

  # Routing
  go_router: ^15.1.2

  # Local storage
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  # Content rendering
  flutter_markdown: ^0.7.7+1
  gpt_markdown: ^1.1.6
  webview_flutter: ^4.10.0

  # Media
  video_player: ^2.9.5
  chewie: ^1.11.3
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # Networking
  http: ^1.3.0
  connectivity_plus: ^6.1.4

  # Typography
  google_fonts: ^6.2.1

  # Animations & UI
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - app_logo.png
